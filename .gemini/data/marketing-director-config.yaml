marketing_director:
  version: "1.0"
  architecture: hierarchical_supervisory
  status: production

  persona:
    id: marketing-director
    name: Morgan
    title: Marketing Director
    model: opus

  thresholds:
    budget_escalation_usd: 25000
    token_cost_confirm_usd: 40
    max_specialist_iterations: 3

  request_types:
    campaign:
      id: campaign
      description: Full multi-channel campaign requiring coordinated specialists
      workflow: research → (creative || copy) → media → compliance → synthesize
      human_review: required_above_budget_threshold
    content_request:
      id: content_request
      description: Single-channel or focused copy/content work
      workflow: copy → compliance
      human_review: optional
    analysis_request:
      id: analysis_request
      description: Performance analysis, attribution, experiment design
      workflow: analytics → synthesize
      human_review: false
    ideation:
      id: ideation
      description: Brainstorming and concept exploration
      workflow: collaborative (creative + copy + research) → synthesize
      human_review: optional
    ops:
      id: ops
      description: Operational lookups — spend pacing, status checks
      workflow: analytics direct
      human_review: false

  specialists:
    research-agent:
      tool_name: research_agent
      model: sonnet
      status: pending_install
      domain: Market research, competitive analysis, audience insights
      loop_budget: 8
      skills:
        - market-research-methodology
        - competitive-analysis
        - customer-insight-synthesis

    creative-agent:
      tool_name: creative_agent
      model: opus
      status: pending_install
      domain: Visual concepts, brand expression, creative direction
      loop_budget: 6
      skills:
        - brand-voice
        - creative-direction
        - visual-storytelling

    copy-agent:
      tool_name: copy_agent
      model: sonnet
      status: pending_install
      domain: Messaging strategy, ad copy, long-form content
      loop_budget: 5
      interim_agent: writer
      skills:
        - brand-voice
        - channel-specific-copy
        - localization-readiness

    media-agent:
      tool_name: media_agent
      model: sonnet
      status: pending_install
      domain: Channel selection, budget allocation, media planning
      loop_budget: 6
      interim_agent: marketer
      skills:
        - media-mix-modeling
        - channel-economics
        - budget-allocation-frameworks

    analytics:
      tool_name: analytics_agent
      model: sonnet
      status: installed
      task_subagent_type: analytics
      domain: Performance analysis, A/B test design, attribution
      loop_budget: 8
      skills:
        - experimentation-design
        - attribution-analysis
        - cohort-analysis

    compliance-agent:
      tool_name: compliance_agent
      model: haiku
      status: pending_install
      domain: Brand-safety review, legal/regulatory review, claim verification
      loop_budget: 4
      skills:
        - claim-verification
        - regulatory-frameworks
        - brand-safety-rules
      severity_levels:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      hard_block_severities:
        - HIGH
        - CRITICAL

  skills_priority:
    p0:
      - brand-voice
      - marketing-plan-current-quarter
      - prohibited-claims-and-disclaimers
    p1:
      - campaign-brief-template
      - media-mix-defaults
      - customer-personas
    p2:
      - crisis-comms-playbook
      - experimentation-standards

  skills:
    brand-voice:
      status: template
      version: "1.0"
      owner: brand team
      path: skills/brand-voice/SKILL.md
      used_by:
        - copy-agent
        - creative-agent
        - marketing-director
      note: Fill in [YOUR_BRAND] placeholders before production use
    prohibited-claims-and-disclaimers:
      status: template
      version: "1.0"
      owner: legal + brand
      path: skills/prohibited-claims-and-disclaimers/SKILL.md
      used_by:
        - compliance-agent
        - marketing-director
      note: Legal team must fill in and sign off before production use

  rollout_phases:
    phase_1:
      name: Content foundation
      specialists: [copy-agent, compliance-agent]
      request_types: [content_request]
    phase_2:
      name: Insights layer
      specialists: [research-agent, analytics]
      request_types: [content_request, analysis_request, ideation, ops]
    phase_3:
      name: Full campaigns
      specialists: [creative-agent, media-agent]
      request_types: [campaign]
    phase_4:
      name: Optimization
      focus: Model tuning, evaluator agents, failure-mode refinement

  governance:
    human_approval_before_external_publish: true
    human_approval_before_spend_commit: true
    no_autonomous_customer_facing_chat: true
    no_self_modifying_behavior: true
    no_pii_in_director_context: true
    audit_log_retention: configurable
    kill_switch: configurable

  output_paths:
    campaigns: docs/marketing/campaigns/
    content: docs/marketing/content/
    strategy: docs/marketing/
    reports: docs/marketing/reports/
    decisions: docs/marketing/decisions/
