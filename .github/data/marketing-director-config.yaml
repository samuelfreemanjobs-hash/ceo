marketing_director:
  version: "1.0"
  architecture: hierarchical_supervisory
  status: production

  persona:
    id: marketing-director
    name: Morgan
    title: Marketing Director
    model: opus

  thresholds:
    budget_escalation_usd: 25000
    token_cost_confirm_usd: 40
    max_specialist_iterations: 3

  request_types:
    campaign:
      id: campaign
      description: Full multi-channel campaign requiring coordinated specialists
      workflow: research → (creative || copy) → media → compliance → synthesize
      human_review: required_above_budget_threshold
    content_request:
      id: content_request
      description: Single-channel or focused copy/content work
      workflow: copy → compliance
      human_review: optional
    analysis_request:
      id: analysis_request
      description: Performance analysis, attribution, experiment design
      workflow: analytics → synthesize
      human_review: false
    ideation:
      id: ideation
      description: Brainstorming and concept exploration
      workflow: collaborative (creative + copy + research) → synthesize
      human_review: optional
    ops:
      id: ops
      description: Operational lookups — spend pacing, status checks
      workflow: analytics direct
      human_review: false

  specialists:
    competition-analyzer:
      tool_name: research_agent
      task_subagent_type: competition-analyzer
      model: sonnet
      status: installed
      domain: Decision-grade competitive intelligence and public GTM analysis — profiles, battle cards, GTM landscapes, funnel teardowns, monitoring checklists, white-space
      loop_budget: 10
      agent_path: agents/competition-analyzer.md
      skills:
        - competitor-profiling
        - gtm-competitor-analysis
        - pricing-teardown
        - source-evaluation
        - strategic-synthesis

    funnel-architect:
      task_subagent_type: funnel-architect
      model: opus
      status: installed
      domain: Funnel audit, design, build, optimize — Funnel Specs, stage copy, metrics, ICE tests
      loop_budget: 12
      agent_path: agents/funnel-architect.md
      package_path: funnel-architect/
      skills:
        - funnel-frameworks
        - audience-mapping
        - channel-playbooks
        - conversion-copywriting
        - funnel-metrics
        - funnel-visualization

    offer-builder:
      task_subagent_type: offer-builder
      model: opus
      status: installed
      domain: Positioning, value propositions, offer architecture — Offer Specs, proof ladders, pricing, ICE validation
      loop_budget: 10
      agent_path: agents/offer-builder.md
      package_path: offer-builder/
      skills:
        - positioning-frameworks
        - value-proposition-design
        - offer-architecture
        - pricing-packaging
        - offer-validation
        - solution-catalog
        - offer-templates
      sub_agents:
        solution-architect:
          task_subagent_type: solution-architect
          model: opus
          status: installed
          domain: Catalog-grounded scope — SKUs, quantities, milestones, success criteria
          agent_path: agents/solution-architect.md
          prompt_path: offer-builder/prompts/agents/solution-architect.md
          output_schema: offer-builder/schemas/offer-schema.json#scope
          skills:
            - solution-catalog
            - offer-templates
          tools:
            - catalog.product.search
            - catalog.dependencies.check
            - catalog.integrations
            - deals.history.search

    research-agent:
      tool_name: research_agent
      model: sonnet
      status: pending_install
      domain: General market research, audience insights (non-competitive)
      loop_budget: 8
      skills:
        - market-research-methodology
        - customer-insight-synthesis
      note: Competitive intelligence routes to competition-analyzer

    creative-agent:
      tool_name: creative_agent
      model: opus
      status: pending_install
      domain: Visual concepts, brand expression, creative direction
      loop_budget: 6
      skills:
        - brand-voice
        - creative-direction
        - visual-storytelling

    copy-agent:
      tool_name: copy_agent
      model: sonnet
      status: pending_install
      domain: Messaging strategy, ad copy, long-form content
      loop_budget: 5
      interim_agent: writer
      skills:
        - brand-voice
        - channel-specific-copy
        - localization-readiness

    media-agent:
      tool_name: media_agent
      model: sonnet
      status: pending_install
      domain: Channel selection, budget allocation, media planning
      loop_budget: 6
      interim_agent: marketer
      skills:
        - media-mix-modeling
        - channel-economics
        - budget-allocation-frameworks

    analytics:
      tool_name: analytics_agent
      model: sonnet
      status: installed
      task_subagent_type: analytics
      domain: Performance analysis, A/B test design, attribution
      loop_budget: 8
      skills:
        - experimentation-design
        - attribution-analysis
        - cohort-analysis

    compliance-agent:
      tool_name: compliance_agent
      model: haiku
      status: pending_install
      domain: Brand-safety review, legal/regulatory review, claim verification
      loop_budget: 4
      skills:
        - claim-verification
        - regulatory-frameworks
        - brand-safety-rules
      severity_levels:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      hard_block_severities:
        - HIGH
        - CRITICAL

  skills_priority:
    p0:
      - brand-voice
      - marketing-plan-current-quarter
      - prohibited-claims-and-disclaimers
    p1:
      - campaign-brief-template
      - media-mix-defaults
      - customer-personas
    p2:
      - crisis-comms-playbook
      - experimentation-standards

  skills:
    brand-voice:
      status: template
      version: "1.0"
      owner: brand team
      path: skills/brand-voice/SKILL.md
      used_by:
        - copy-agent
        - creative-agent
        - marketing-director
      note: Fill in [YOUR_BRAND] placeholders before production use
    prohibited-claims-and-disclaimers:
      status: template
      version: "1.0"
      owner: legal + brand
      path: skills/prohibited-claims-and-disclaimers/SKILL.md
      used_by:
        - compliance-agent
        - marketing-director
      note: Legal team must fill in and sign off before production use
    marketing-plan-current-quarter:
      status: template
      version: "1.0"
      owner: cmo office
      path: skills/marketing-plan-current-quarter/SKILL.md
      used_by:
        - marketing-director
        - research-agent
        - competition-analyzer
        - copy-agent
        - media-agent
        - creative-agent
      note: Refresh in the first week of each quarter
      refresh_cadence: quarterly
    gtm-competitor-analysis:
      status: installed
      version: "1.0"
      owner: marketing research
      path: skills/gtm-competitor-analysis/SKILL.md
      package_path: competition-analyzer/skills/gtm-competitor-analysis/SKILL.md
      used_by:
