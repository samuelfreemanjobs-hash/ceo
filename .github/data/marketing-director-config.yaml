  rollout_phases:
    phase_1:
      name: Content foundation
      specialists: [copy-agent, compliance-agent]
      request_types: [content_request]
    phase_2:
      name: Insights layer
      specialists: [competition-analyzer, funnel-architect, offer-builder, research-agent, analytics]
      request_types: [content_request, analysis_request, ideation, ops]
    phase_3:
      name: Full campaigns
      specialists: [creative-agent, media-agent]
      request_types: [campaign]
    phase_4:
      name: Optimization
      focus: Model tuning, evaluator agents, failure-mode refinement

  governance:
    human_approval_before_external_publish: true
    human_approval_before_spend_commit: true
    no_autonomous_customer_facing_chat: true
    no_self_modifying_behavior: true
    no_pii_in_director_context: true
    audit_log_retention: configurable
    kill_switch: configurable

  output_paths:
    campaigns: docs/marketing/campaigns/
    content: docs/marketing/content/
    strategy: docs/marketing/
    reports: docs/marketing/reports/
    decisions: docs/marketing/decisions/
    research:
      profiles: docs/marketing/research/profiles/
      battle_cards: docs/marketing/research/battle-cards/
      alerts: docs/marketing/research/alerts/
      general: docs/marketing/research/
    funnels: docs/marketing/funnels/
    offers: docs/marketing/offers/
