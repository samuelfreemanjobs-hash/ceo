name: Automation — Daily Inbox

on:
  schedule:
    - cron: "0 14 * * *"  # 14:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process inbox
        run: python3 .ai/utils/process-inbox.py process-all

      - name: Log orchestration
        run: |
          python3 .ai/utils/orchestration-log.py append \
            --tier 1 --pattern augmented-single \
            --agents ceo --rationale "Daily inbox automation" \
            --outcome success

      - name: Commit promoted specs (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox/ specs/
          git diff --staged --quiet || git commit -m "chore(automation): daily inbox processing"
          git push || true
