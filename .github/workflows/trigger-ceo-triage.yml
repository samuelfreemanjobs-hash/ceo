name: Trigger — CEO Triage

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      request:
        description: "Request text for triage dry-run"
        required: false
        default: "Review automation status"

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'ceo-triage')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log triage trigger
        run: |
          python3 .ai/utils/orchestration-log.py append \
            --tier 1 --pattern augmented-single \
            --agents ceo \
            --rationale "GitHub issue/workflow CEO triage trigger" \
            --outcome success

      - name: Comment on issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Cleo triage triggered.** Label `ceo-triage` received. Open a Cleo session with `*plan` on this issue body, or run workflow **Trigger — CEO Triage** manually.'
            })
