name: Offer Builder Schema Validation

on:
  push:
    paths:
      - 'offer-builder/schemas/**'
      - 'offer-builder/mocks/**'
      - 'tests/test_offer_schemas.py'
      - '.github/workflows/offer-schema-validation.yml'
  pull_request:
    paths:
      - 'offer-builder/schemas/**'
      - 'offer-builder/mocks/**'
      - 'tests/test_offer_schemas.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema pytest
      - run: python -m pytest tests/test_offer_schemas.py -q
