[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-director"
version = "1.0.0"
description = "Hierarchical marketing multi-agent orchestrator (Anthropic API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "PyYAML>=6.0",
]

[project.scripts]
marketing-director = "marketing_director.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
